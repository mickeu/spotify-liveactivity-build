name: Live Island build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout plugin source
        uses: actions/checkout@v4
        with:
          repository: mickeu/spotify-liveactivity-build
          path: src

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build
        run: bash src/scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: liveisland
          path: src/dist/
          if-no-files-found: error
